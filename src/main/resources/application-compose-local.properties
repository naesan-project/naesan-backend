spring.datasource.url=${NAESAN_DB_URL}
spring.datasource.username=${NAESAN_DB_USERNAME}
spring.datasource.password=${NAESAN_DB_PASSWORD}
naesan.security.frontend-origin=${NAESAN_FRONTEND_ORIGIN:http://localhost:8080}
naesan.security.token.jwt-secret=${NAESAN_AUTH_JWT_SECRET}
naesan.security.token.refresh-cookie-secure=false
naesan.storage.provider=s3
naesan.storage.s3.bucket=${NAESAN_S3_BUCKET}
naesan.storage.s3.region=${NAESAN_S3_REGION}
naesan.storage.s3.endpoint=${NAESAN_S3_ENDPOINT:}
naesan.storage.s3.path-style=${NAESAN_S3_PATH_STYLE:false}
naesan.storage.s3.server-side-encryption=${NAESAN_S3_SERVER_SIDE_ENCRYPTION:}
naesan.proof.provider=${NAESAN_PROOF_PROVIDER:fake}
naesan.proof.worker.enabled=${NAESAN_PROOF_WORKER_ENABLED:true}
naesan.proof.evm.rpc-url=${NAESAN_EVM_RPC_URL:}
naesan.proof.evm.chain-id=${NAESAN_EVM_CHAIN_ID:}
naesan.proof.evm.contract-address=${NAESAN_EVM_CONTRACT_ADDRESS:}
naesan.proof.evm.private-key=${NAESAN_EVM_PRIVATE_KEY:}
naesan.proof.evm.deployment-block=${NAESAN_EVM_DEPLOYMENT_BLOCK:}
naesan.proof.evm.required-confirmations=${NAESAN_EVM_REQUIRED_CONFIRMATIONS:2}
naesan.proof.evm.receipt-attempts=${NAESAN_EVM_RECEIPT_ATTEMPTS:12}
naesan.proof.evm.receipt-poll-interval=${NAESAN_EVM_RECEIPT_POLL_INTERVAL:1s}
management.server.port=${NAESAN_MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,prometheus
