spring.application.name=naesan
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.additional-path=server:/health
management.endpoint.health.group.readiness.additional-path=server:/ready
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
naesan.evidence.file.max-size=10MB
naesan.evidence.orphan.minimum-age=1h
naesan.evidence.orphan.initial-delay=1h
naesan.evidence.orphan.interval=1h
naesan.evidence.deletion.initial-delay=1h
naesan.evidence.deletion.interval=1h
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
naesan.security.frontend-origin=http://localhost:5173
naesan.security.token.issuer=naesan
naesan.security.token.audience=naesan-api
naesan.security.token.jwt-secret=bmFlc2FuLWxvY2FsLWRldmVsb3BtZW50LWtleS0zMmI=
naesan.security.token.access-time-to-live=15m
naesan.security.token.refresh-time-to-live=30d
naesan.security.token.refresh-cookie-secure=false
naesan.proof.provider=fake
naesan.proof.worker.enabled=true
naesan.proof.worker.id=local-proof-worker
naesan.proof.worker.batch-size=20
naesan.proof.worker.lease-duration=30s
naesan.proof.worker.maximum-attempts=5
naesan.proof.worker.retry-base-delay=1s
naesan.proof.worker.retry-maximum-delay=5m
naesan.proof.worker.initial-delay=1h
naesan.proof.worker.interval=1s
naesan.share.time-to-live=7d
naesan.share.file-match.max-size=10MB
naesan.share.rate-limit.verification-requests=60
naesan.share.rate-limit.file-match-requests=5
naesan.share.rate-limit.window=1m
naesan.transfer.time-to-live=7d
naesan.storage.local.root=${java.io.tmpdir}/naesan/object-storage
