spring.application.name=naesan
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
naesan.evidence.file.max-size=10MB
naesan.security.frontend-origin=http://localhost:5173
naesan.security.session.absolute-timeout=12h
naesan.storage.local.root=${java.io.tmpdir}/naesan/object-storage
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
