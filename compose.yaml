services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${NAESAN_DB_NAME:-naesan}
      POSTGRES_USER: ${NAESAN_DB_USERNAME:-naesan}
      POSTGRES_PASSWORD: ${NAESAN_DB_PASSWORD:?NAESAN_DB_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${NAESAN_DB_USERNAME:-naesan} -d ${NAESAN_DB_NAME:-naesan}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${NAESAN_S3_ACCESS_KEY:?NAESAN_S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${NAESAN_S3_SECRET_KEY:?NAESAN_S3_SECRET_KEY is required}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - object-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${NAESAN_S3_ACCESS_KEY:?NAESAN_S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${NAESAN_S3_SECRET_KEY:?NAESAN_S3_SECRET_KEY is required}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/naesan-private
        && mc anonymous set none local/naesan-private

  application:
    build:
      context: .
    image: naesan:local
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: production
      NAESAN_DB_URL: jdbc:postgresql://postgres:5432/${NAESAN_DB_NAME:-naesan}
      NAESAN_DB_USERNAME: ${NAESAN_DB_USERNAME:-naesan}
      NAESAN_DB_PASSWORD: ${NAESAN_DB_PASSWORD:?NAESAN_DB_PASSWORD is required}
      NAESAN_FRONTEND_ORIGIN: ${NAESAN_FRONTEND_ORIGIN:-https://localhost:5173}
      NAESAN_S3_BUCKET: naesan-private
      NAESAN_S3_REGION: ap-northeast-2
      NAESAN_S3_ENDPOINT: http://minio:9000
      NAESAN_S3_PATH_STYLE: "true"
      NAESAN_S3_SERVER_SIDE_ENCRYPTION: ""
      AWS_ACCESS_KEY_ID: ${NAESAN_S3_ACCESS_KEY:?NAESAN_S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${NAESAN_S3_SECRET_KEY:?NAESAN_S3_SECRET_KEY is required}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/ready
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
    ports:
      - "8080:8080"

volumes:
  object-data:
  postgres-data:
