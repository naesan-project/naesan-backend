name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          cache: gradle
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: contracts/package-lock.json
          node-version: '24'

      - name: Verify EVM contract
        working-directory: contracts
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Run local-chain integration tests
        run: ./gradlew evmTest --no-daemon

      - name: Build production image
        run: docker build --tag naesan-backend:ci .
