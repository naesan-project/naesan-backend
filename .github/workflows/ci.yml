name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          cache: gradle
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build production image
        run: docker build --tag naesan-backend:ci .
